name: Core CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: core-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_repo.py
      - run: python tools/validate_learner_persistence.py
      - run: python tools/validate_ppocr_dictionary_manifest_wiring.py
      - run: python tools/validate_local_ocr_asset_staging.py
      - run: python tools/stage_models.py --purpose-prefix ocr- --include-support --list
      - run: python tools/test_extract_ppocr_dictionary.py
      - run: python tools/test_prepare_unity_ocr_assets.py
      - run: python tools/test_prepare_unity_tokenizer_runtime.py
      - run: python tools/test_prepare_unity_marian_tokenizer_assets.py
      - run: python tools/test_validate_marian_snapshot_contract.py
      - run: python tools/test_fetch_marian_snapshot_metadata.py
      - run: python tools/test_validate_marian_lock_evidence.py
      - run: python tools/validate_marian_lock_evidence.py
      - run: python tools/test_export_marian_onnx.py
      - run: python tools/test_inspect_marian_onnx_bundle.py
      - run: python tools/test_validate_moonshine_snapshot_contract.py
      - run: python tools/test_fetch_moonshine_snapshot_metadata.py
      - run: python tools/test_fetch_moonshine_weight_metadata.py
      - run: python tools/test_validate_moonshine_evidence.py
      - run: python tools/validate_moonshine_evidence.py
      - run: python tools/test_validate_moonshine_lock_evidence.py
      - run: python tools/validate_moonshine_lock_evidence.py
      - run: python tools/test_inspect_moonshine_tokenizer.py
      - run: python tools/test_prepare_moonshine_token_decoder_assets.py
      - run: python tools/test_inspect_moonshine_v1_onnx_bundle.py
      - run: dotnet restore tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj
      - run: dotnet build src/PhraseLayer.Core/PhraseLayer.Core.csproj -c Release --no-restore
      - run: dotnet test tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj -c Release --no-restore
      - run: dotnet restore tests/PhraseLayer.Tokenization.Microsoft.Tests/PhraseLayer.Tokenization.Microsoft.Tests.csproj
      - run: dotnet build src/PhraseLayer.Tokenization.Microsoft/PhraseLayer.Tokenization.Microsoft.csproj -c Release --no-restore
      - run: dotnet test tests/PhraseLayer.Tokenization.Microsoft.Tests/PhraseLayer.Tokenization.Microsoft.Tests.csproj -c Release --no-restore
      - name: Verify Unity tokenizer staging from real build output
        run: |
          python tools/prepare_unity_tokenizer_runtime.py \
            --build-output src/PhraseLayer.Tokenization.Microsoft/bin/Release/netstandard2.1 \
            --destination "$RUNNER_TEMP/LocalTokenizerRuntime" \
            --manifest "$RUNNER_TEMP/unity-tokenizer-runtime.manifest.json"
      - run: dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityShell.Compile.csproj -c Release
      - name: Compile guarded Marian Unity inference path
        run: dotnet build tests/PhraseLayer.UnityMarianInferenceShell.Compile/PhraseLayer.UnityMarianInferenceShell.Compile.csproj -c Release
