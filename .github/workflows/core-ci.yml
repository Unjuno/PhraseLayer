name: Core CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_repo.py
      - run: python tools/validate_ppocr_dictionary_manifest_wiring.py
      - run: python tools/stage_models.py --purpose-prefix ocr- --include-support --list
      - name: Measure pinned PP-OCR recognizer YAML dictionary
        run: |
          python tools/stage_models.py --model pp-ocrv6-tiny-rec --include-support --allow-unverified-metadata
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('artifacts/models/pp-ocrv6-tiny-rec/inference.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          def decode_scalar(text):
              value = text.strip()
              if value.startswith("'") and value.endswith("'") and len(value) >= 2:
                  return value[1:-1].replace("''", "'")
              if value.startswith('"') and value.endswith('"') and len(value) >= 2:
                  return json.loads(value)
              return value

          postprocess_index = next(i for i, line in enumerate(lines) if line == 'PostProcess:')
          name_line = next(
              line for line in lines[postprocess_index + 1:]
              if line.startswith('  name: ')
          )
          postprocess_name = decode_scalar(name_line.split(':', 1)[1])
          dictionary_index = next(
              i for i in range(postprocess_index + 1, len(lines))
              if lines[i] == '  character_dict:'
          )
          tokens = []
          for line in lines[dictionary_index + 1:]:
              if not line.startswith('  - '):
                  break
              tokens.append(decode_scalar(line[4:]))

          output = ''.join(token + '\n' for token in tokens).encode('utf-8')
          print('POSTPROCESS_NAME', postprocess_name)
          print('RAW_TOKEN_COUNT', len(tokens))
          print('RAW_CONTAINS_LITERAL_SPACE', ' ' in tokens)
          print('FIRST_TOKENS', repr(tokens[:12]))
          print('LAST_TOKENS', repr(tokens[-12:]))
          print('GENERATED_DICTIONARY_SIZE_BYTES', len(output))
          print('GENERATED_DICTIONARY_SHA256', hashlib.sha256(output).hexdigest())
          print('EFFECTIVE_TOKEN_COUNT_WITH_SPACE', len(tokens) + 1)
          PY
      - run: python tools/test_extract_ppocr_dictionary.py
      - run: dotnet restore tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj
      - run: dotnet build src/PhraseLayer.Core/PhraseLayer.Core.csproj -c Release --no-restore
      - run: dotnet test tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj -c Release --no-restore
      - run: dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityShell.Compile.csproj -c Release
