name: Core CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_repo.py
      - run: python tools/validate_ppocr_dictionary_manifest_wiring.py
      - run: python tools/stage_models.py --purpose-prefix ocr- --include-support --list
      - name: Inspect pinned PP-OCR recognizer export config
        run: |
          python tools/stage_models.py --model pp-ocrv6-tiny-rec --include-support --allow-unverified-metadata
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/models/pp-ocrv6-tiny-rec/inference.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          print('INFERENCE_YML_LINES', len(lines))
          terms = ('postprocess', 'character_dict', 'use_space_char', 'ctclabeldecode')
          emitted = set()
          for index, line in enumerate(lines):
              lowered = line.lower()
              if any(term in lowered for term in terms):
                  start = max(0, index - 3)
                  end = min(len(lines), index + 25)
                  for line_index in range(start, end):
                      if line_index not in emitted:
                          print(f'YML {line_index + 1}: {lines[line_index][:1000]}')
                          emitted.add(line_index)
                  print('---')
          PY
      - run: python tools/test_extract_ppocr_dictionary.py
      - run: dotnet restore tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj
      - run: dotnet build src/PhraseLayer.Core/PhraseLayer.Core.csproj -c Release --no-restore
      - run: dotnet test tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj -c Release --no-restore
      - run: dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityShell.Compile.csproj -c Release
