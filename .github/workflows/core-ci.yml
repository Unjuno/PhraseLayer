name: Core CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_repo.py
      - run: python tools/validate_local_only.py
      - run: python tools/test_validate_local_only.py
      - run: python tools/validate_unity_build_automation.py
      - run: python tools/validate_unity_compile_preflight.py
      - run: python tools/validate_learner_persistence.py
      - run: python tools/validate_ppocr_dictionary_manifest_wiring.py
      - run: python tools/validate_local_ocr_asset_staging.py
      - run: python tools/validate_quest_ocr_smoke_harness.py
      - run: python tools/validate_quest_read_assistance_slice.py
      - run: python tools/stage_models.py --purpose-prefix ocr- --include-support --list
      - run: python tools/test_extract_ppocr_dictionary.py
      - run: python tools/test_prepare_unity_ocr_assets.py
      - run: dotnet restore tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj
      - run: dotnet build src/PhraseLayer.Core/PhraseLayer.Core.csproj -c Release --no-restore
      - run: dotnet test tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj -c Release --no-restore
      - run: dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityShell.Compile.csproj -c Release
      - run: dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityAndroid.Compile.csproj -c Release
