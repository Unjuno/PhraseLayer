name: Core CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.423"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_build_environment.py
      - run: python tools/validate_repo.py
      - run: python tools/validate_ci_references.py
      - run: python tools/validate_local_only.py
      - run: python tools/test_validate_local_only.py
      - run: python tools/validate_unity_build_automation.py
      - run: python tools/validate_unity_compile_preflight.py
      - run: python tools/validate_unity_csharp9.py
      - run: python tools/test_extract_unity_compile_errors.py
      - run: python tools/validate_learner_persistence.py
      - run: python tools/validate_ppocr_dictionary_manifest_wiring.py
      - run: python tools/validate_local_ocr_asset_staging.py
      - run: python tools/validate_quest_ocr_smoke_harness.py
      - run: python tools/validate_read_vertical_slice.py
      - run: python tools/validate_translation_model_candidate.py
      - run: python tools/validate_translation_export_probe.py
      - run: python tools/validate_local_translation_asset_staging.py
      - run: python tools/stage_models.py --purpose-prefix ocr- --include-support --list
      - run: python tools/test_extract_ppocr_dictionary.py
      - run: python tools/test_prepare_unity_ocr_assets.py
      - run: python tools/test_prepare_unity_translation_assets.py
      - run: dotnet restore tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj
      - run: dotnet build src/PhraseLayer.Core/PhraseLayer.Core.csproj -c Release --no-restore
      - run: dotnet test tests/PhraseLayer.Core.Tests/PhraseLayer.Core.Tests.csproj -c Release --no-restore

  unity-compile-preflight:
    name: Unity compile preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.423"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate preflight contract
        run: |
          python tools/validate_build_environment.py
          python tools/validate_unity_compile_preflight.py
          python tools/validate_unity_csharp9.py
      - name: Capture preflight environment
        shell: bash
        run: |
          mkdir -p .ci
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "dotnet=$(dotnet --version)"
            echo "python=$(python --version 2>&1)"
            echo "--- global.json ---"
            cat global.json
            echo "--- ci/unity-environment.lock.json ---"
            cat ci/unity-environment.lock.json
            echo "--- ProjectVersion.txt ---"
            cat unity/PhraseLayer.Unity/ProjectSettings/ProjectVersion.txt
            echo "--- Packages/manifest.json ---"
            cat unity/PhraseLayer.Unity/Packages/manifest.json
            echo "--- Packages/packages-lock.json ---"
            if [ -f unity/PhraseLayer.Unity/Packages/packages-lock.json ]; then
              cat unity/PhraseLayer.Unity/Packages/packages-lock.json
            else
              echo "<not committed yet>"
            fi
          } > .ci/unity-environment.txt
      - name: Compile Unity Editor guarded branches
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityShell.Compile.csproj -c Release 2>&1 | tee .ci/unity-editor-preflight.log
          code=${PIPESTATUS[0]}
          echo "$code" > .ci/unity-editor-preflight.exit
          exit 0
      - name: Compile Android Player guarded branches
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          dotnet build tests/PhraseLayer.UnityShell.Compile/PhraseLayer.UnityAndroid.Compile.csproj -c Release 2>&1 | tee .ci/unity-android-preflight.log
          code=${PIPESTATUS[0]}
          echo "$code" > .ci/unity-android-preflight.exit
          exit 0
      - name: Summarize compiler diagnostics
        if: always()
        shell: bash
        run: |
          echo "## Unity Editor diagnostics"
          python tools/extract_unity_compile_errors.py .ci/unity-editor-preflight.log || true
          echo "## Android Player diagnostics"
          python tools/extract_unity_compile_errors.py .ci/unity-android-preflight.log || true
      - name: Upload compile preflight logs and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-compile-preflight-logs
          path: |
            .ci/unity-environment.txt
            .ci/unity-editor-preflight.log
            .ci/unity-android-preflight.log
            .ci/unity-editor-preflight.exit
            .ci/unity-android-preflight.exit
          if-no-files-found: error
      - name: Publish exact compiler diagnostic statuses
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const firstCompilerError = path => {
              const match = read(path).match(/^.*error CS\d{4}.*$/m);
              return match ? match[0].replace(/\s+/g, ' ').trim() : '';
            };
            const editorExit = read('.ci/unity-editor-preflight.exit').trim() || 'missing';
            const androidExit = read('.ci/unity-android-preflight.exit').trim() || 'missing';
            const editorPassed = editorExit === '0';
            const androidPassed = androidExit === '0';
            const editorError = firstCompilerError('.ci/unity-editor-preflight.log');
            const androidError = firstCompilerError('.ci/unity-android-preflight.log');
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const publish = async (contextName, passed, description) => {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed ? 'success' : 'failure',
                context: contextName,
                target_url: targetUrl,
                description: description.slice(0, 140)
              });
            };
            await publish(
              'phraselayer/unity-editor-preflight',
              editorPassed,
              editorPassed ? 'Unity Editor C# preflight passed' : (editorError || `Unity Editor preflight failed exit=${editorExit}`)
            );
            await publish(
              'phraselayer/unity-android-preflight',
              androidPassed,
              androidPassed ? 'Unity Android C# preflight passed' : (androidError || `Unity Android preflight failed exit=${androidExit}`)
            );
            const allPassed = editorPassed && androidPassed;
            const aggregateError = editorError || androidError || `Unity preflight failed Editor=${editorExit} Android=${androidExit}`;
            await publish(
              'phraselayer/unity-preflight',
              allPassed,
              allPassed ? 'Unity Editor and Android C# preflight passed' : aggregateError
            );
      - name: Enforce compile preflight result
        if: always()
        shell: bash
        run: |
          editor=$(cat .ci/unity-editor-preflight.exit)
          android=$(cat .ci/unity-android-preflight.exit)
          if [ "$editor" -ne 0 ] || [ "$android" -ne 0 ]; then
            echo "::error::Unity compile preflight failed (Editor=$editor, Android=$android). See the compiler diagnostics above and the unity-compile-preflight-logs artifact."
            exit 1
          fi
          echo "Unity compile preflight PASS (Editor=0, Android=0)."

  publish-unity-preflight-status:
    name: Publish Unity preflight status
    if: ${{ always() && github.event_name == 'push' }}
    needs: [unity-compile-preflight]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve final preflight status
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.unity-compile-preflight.result }}' === 'success';
            if (passed) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'success',
                context: 'phraselayer/unity-preflight',
                target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                description: 'Unity Editor and Android C# preflight passed'
              });
            }
