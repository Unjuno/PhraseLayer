name: Translation export probe

on:
  workflow_dispatch:
  push:
    paths:
      - ci/translation-export-probe.request

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish pending probe status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'phraselayer/translation-export-probe',
              description: 'Pinned OPUS-MT export/parity probe is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.423"

      - name: Validate probe contract
        run: |
          python tools/validate_translation_model_candidate.py
          python tools/validate_translation_export_probe.py

      - name: Install measured export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.13.0" \
            "transformers==4.57.6" \
            "optimum==2.1.0" \
            "optimum-onnx[onnxruntime]==0.1.0" \
            "onnx==1.22.0" \
            "onnxruntime==1.29.0" \
            "sentencepiece==0.2.2"
          python -m pip freeze > translation-export-pip-freeze.txt

      - name: Export, inspect, and compare pinned OPUS-MT
        id: export
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          python tools/probe_translation_export.py \
            --output "$RUNNER_TEMP/opus-mt-en-jap-onnx" \
            --report ".ci/translation-export-probe.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect measured SentencePiece contract
        id: sentencepiece
        if: always()
        shell: bash
        env:
          EXPORT_EXIT_CODE: ${{ steps.export.outputs.exit_code }}
        run: |
          set +e
          if [ "$EXPORT_EXIT_CODE" != "0" ]; then
            echo "Skipping SentencePiece inspection because export/parity failed first."
            code=99
          else
            python tools/inspect_translation_sentencepiece.py \
              --export-root "$RUNNER_TEMP/opus-mt-en-jap-onnx" \
              --report ".ci/translation-export-probe.json"
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare ephemeral managed tokenizer manifest
        id: managed_manifest
        if: always()
        shell: bash
        env:
          SENTENCEPIECE_EXIT_CODE: ${{ steps.sentencepiece.outputs.exit_code }}
        run: |
          set +e
          if [ "$SENTENCEPIECE_EXIT_CODE" != "0" ]; then
            echo "Skipping managed manifest because SentencePiece inspection failed first."
            code=99
          else
            python tools/prepare_managed_sentencepiece_manifest.py \
              --export-root "$RUNNER_TEMP/opus-mt-en-jap-onnx" \
              --report ".ci/translation-export-probe.json" \
              --output "$RUNNER_TEMP/phraselayer-sentencepiece-unigram-v1.txt"
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify PhraseLayer managed tokenizer parity
        id: managed_parity
        if: always()
        shell: bash
        env:
          MANAGED_MANIFEST_EXIT_CODE: ${{ steps.managed_manifest.outputs.exit_code }}
        run: |
          set +e
          if [ "$MANAGED_MANIFEST_EXIT_CODE" != "0" ]; then
            echo "Skipping managed tokenizer parity because manifest preparation failed first."
            code=99
          else
            dotnet run \
              --project tools/PhraseLayer.TokenizerParityProbe/PhraseLayer.TokenizerParityProbe.csproj \
              -c Release -- \
              "$RUNNER_TEMP/phraselayer-sentencepiece-unigram-v1.txt" \
              ".ci/translation-export-probe.json"
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload probe metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-export-probe
          path: |
            .ci/translation-export-probe.json
            translation-export-pip-freeze.txt
          if-no-files-found: error

      - name: Publish final probe status
        if: always()
        uses: actions/github-script@v7
        env:
          EXPORT_EXIT_CODE: ${{ steps.export.outputs.exit_code }}
          SENTENCEPIECE_EXIT_CODE: ${{ steps.sentencepiece.outputs.exit_code }}
          MANAGED_MANIFEST_EXIT_CODE: ${{ steps.managed_manifest.outputs.exit_code }}
          MANAGED_PARITY_EXIT_CODE: ${{ steps.managed_parity.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.ci/translation-export-probe.json';
            let report = null;
            if (fs.existsSync(reportPath)) {
              try {
                report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              } catch (error) {
                core.warning(`Could not parse translation export report: ${error}`);
              }
            }
            const exportExitCode = process.env.EXPORT_EXIT_CODE || 'missing';
            const sentencePieceExitCode = process.env.SENTENCEPIECE_EXIT_CODE || 'missing';
            const managedManifestExitCode = process.env.MANAGED_MANIFEST_EXIT_CODE || 'missing';
            const managedParityExitCode = process.env.MANAGED_PARITY_EXIT_CODE || 'missing';
            const sp = report && report.sentencepiece_contract;
            const spMeasured = sp && sp.status === 'measured-export-artifacts' && Array.isArray(sp.models) && sp.models.length === 2;
            const managedManifest = report && report.managed_tokenizer_manifest;
            const managedParity = report && report.managed_tokenizer_parity;
            const managedVerified = managedManifest
              && managedManifest.status === 'ephemeral-local-runtime-artifact'
              && managedManifest.uploaded === false
              && managedParity
              && managedParity.exact === true;
            const passed = exportExitCode === '0'
              && sentencePieceExitCode === '0'
              && managedManifestExitCode === '0'
              && managedParityExitCode === '0'
              && report
              && report.status === 'pass'
              && report.parity
              && report.parity.exact
              && report.tokenizer_parity
              && report.tokenizer_parity.exact
              && spMeasured
              && managedVerified;
            const runtimeSize = report && report.runtime_sets && report.runtime_sets.encoder_plus_decoder
              ? report.runtime_sets.encoder_plus_decoder.total_size_mib
              : null;
            const modelTypes = spMeasured ? sp.models.map(item => item.model_type).join('/') : 'unmeasured';
            const detail = passed
              ? `OPUS-MT parity exact; managed tokenizer exact; SentencePiece ${modelTypes}; runtime ${runtimeSize} MiB`
              : `OPUS-MT probe failed (export=${exportExitCode},sp=${sentencePieceExitCode},manifest=${managedManifestExitCode},managed=${managedParityExitCode})`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'phraselayer/translation-export-probe',
              description: detail.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
            if (!passed) {
              core.setFailed(detail);
            }
