name: Translation ONNX export probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-opus-mt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned export probe toolchain
        run: |
          mkdir -p artifacts
          python -m pip install --upgrade pip
          python -m pip install \
            "optimum[onnx]==2.3.0" \
            "sentencepiece==0.2.2"
          python -m pip freeze > artifacts/translation-export-toolchain.txt
      - name: Validate candidate and exporter contract
        run: |
          python tools/validate_translation_model_candidate.py
          python tools/validate_translation_export_probe.py
          python tools/test_export_opus_mt_onnx.py
      - name: Export exact OPUS-MT revision and inspect actual ONNX files
        run: |
          python tools/export_opus_mt_onnx.py \
            --output-dir artifacts/translation-export/opus-mt-en-jap
      - name: Show measured export manifest
        run: cat artifacts/translation-export/opus-mt-en-jap/translation-export.manifest.json
      - name: Upload export probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opus-mt-en-jap-onnx-probe
          path: |
            artifacts/translation-export-toolchain.txt
            artifacts/translation-export/opus-mt-en-jap/**
          if-no-files-found: error
          retention-days: 7
