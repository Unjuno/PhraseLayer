name: OCR DB Acceptance Sweep

on:
  push:
    branches:
      - agent/read-mode-quest-gate
  pull_request:
    paths:
      - 'src/PhraseLayer.Core/PaddleDbPostprocess.cs'
      - 'src/PhraseLayer.Core/PaddleDbQuadPostprocessor.cs'
      - 'experiments/PhraseLayer.DetectorOutputReplay/**'
      - 'tools/run_ppocr_detector_db_differential.py'
      - 'tools/run_ppocr_db_acceptance_sweep.py'
      - 'tools/requirements-ocr-db-audit.txt'
      - '.github/workflows/ocr-db-acceptance-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned host-only DB oracle tools
        run: python -m pip install -r tools/requirements-ocr-db-audit.txt
      - name: Sweep real 0.4 box-score decision boundary
        run: |
          python tools/run_ppocr_db_acceptance_sweep.py \
            --work-dir artifacts/ocr-db-acceptance/work \
            --report artifacts/ocr-db-acceptance/report.json
      - name: Upload numerical summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-db-acceptance-${{ github.run_id }}
          path: artifacts/ocr-db-acceptance/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove local probability maps
        if: always()
        run: rm -rf artifacts/ocr-db-acceptance/work
