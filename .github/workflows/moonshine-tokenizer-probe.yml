name: Moonshine Tokenizer Probe

on:
  push:
    branches: ["agent/listen-mode-core"]
    paths:
      - ".github/workflows/moonshine-tokenizer-probe.yml"
      - "tools/inspect_moonshine_tokenizer.py"
      - "tools/prepare_moonshine_token_decoder_assets.py"
      - "tools/build_moonshine_decoder_parity_cases.py"
      - "tools/fetch_moonshine_snapshot_metadata.py"
      - "src/PhraseLayer.Core/MoonshineBinaryTokenDecoder.cs"
      - "tests/PhraseLayer.MoonshineDecoderParity/**"
      - "models/models.lock.json"
      - "models/evidence/moonshine-tiny.*.snapshot.json"

concurrency:
  group: moonshine-tokenizer-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tokenizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate lock and committed evidence
        run: |
          python tools/validate_moonshine_evidence.py
          python tools/validate_moonshine_lock_evidence.py
      - name: Read exact revision from lock
        id: lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lock = json.loads(Path("models/models.lock.json").read_text(encoding="utf-8"))
          candidate = next(item for item in lock["candidates"] if item["id"] == "moonshine-tiny")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("revision=" + candidate["revision"], file=output)
          PY
      - name: Install pinned Hub/tokenizer reference clients
        run: python -m pip install --disable-pip-version-check "huggingface_hub==0.36.2" "tokenizers==0.22.1"
      - name: Stage exact tokenizer snapshot
        run: |
          python tools/fetch_moonshine_snapshot_metadata.py \
            --revision "${{ steps.lock.outputs.revision }}" \
            --destination "$RUNNER_TEMP/moonshine-tiny-small" \
            --output-manifest "$RUNNER_TEMP/moonshine-tiny.snapshot.json"
      - name: Inspect tokenizer pipeline
        run: |
          python tools/inspect_moonshine_tokenizer.py \
            --tokenizer "$RUNNER_TEMP/moonshine-tiny-small/tokenizer.json" \
            --output "$RUNNER_TEMP/moonshine-tiny.tokenizer-contract.json"
      - name: Prepare native-compatible decoder asset
        run: |
          python tools/prepare_moonshine_token_decoder_assets.py \
            --tokenizer "$RUNNER_TEMP/moonshine-tiny-small/tokenizer.json" \
            --output "$RUNNER_TEMP/moonshine-tiny.tokens.bin" \
            --manifest "$RUNNER_TEMP/moonshine-tiny.tokens.manifest.json"
      - name: Build trusted reference decode cases
        run: |
          python tools/build_moonshine_decoder_parity_cases.py \
            --tokenizer "$RUNNER_TEMP/moonshine-tiny-small/tokenizer.json" \
            --output "$RUNNER_TEMP/moonshine-tiny.decode-cases.json"
      - name: Compare managed decoder with tokenizers reference
        run: |
          dotnet run --project tests/PhraseLayer.MoonshineDecoderParity/PhraseLayer.MoonshineDecoderParity.csproj -c Release -- \
            "$RUNNER_TEMP/moonshine-tiny.tokens.bin" \
            "$RUNNER_TEMP/moonshine-tiny.decode-cases.json"
      - uses: actions/upload-artifact@v4
        with:
          name: moonshine-tiny-tokenizer-contract
          path: |
            ${{ runner.temp }}/moonshine-tiny.tokenizer-contract.json
            ${{ runner.temp }}/moonshine-tiny.tokens.manifest.json
            ${{ runner.temp }}/moonshine-tiny.decode-cases.json
          if-no-files-found: error
          retention-days: 7
