name: Android IL2CPP Listen Mode

on:
  workflow_dispatch:
    inputs:
      marian_source_dir:
        description: "Absolute path on the self-hosted runner to the exact pinned opus-mt-en-jap source snapshot"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, unity, unity-6000-0-66f2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned offline model tooling
        run: |
          python -m pip install --disable-pip-version-check \
            -r tools/requirements-marian-export.txt \
            "huggingface_hub==0.36.2"
      - name: Validate local Marian source and stage real translation runtime
        shell: bash
        env:
          PHRASELAYER_MARIAN_SOURCE_DIR: ${{ inputs.marian_source_dir }}
          PHRASELAYER_MARIAN_WORK_DIR: ${{ runner.temp }}/marian-unity
        run: |
          chmod +x tools/unity/stage-marian-runtime.sh
          ./tools/unity/stage-marian-runtime.sh
      - name: Stage exact Moonshine v1 deployment graphs
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="moonshine-ai/moonshine",
              revision="35b4aae79f7d598a4d36d5252ec26ad642faab60",
              allow_patterns=[
                  "onnx/tiny/preprocess.onnx",
                  "onnx/tiny/encode.onnx",
                  "onnx/tiny/uncached_decode.onnx",
                  "onnx/tiny/cached_decode.onnx",
              ],
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "moonshine-v1-reference"),
          )
          PY
          python tools/prepare_unity_moonshine_v1_assets.py \
            --snapshot-root "$RUNNER_TEMP/moonshine-v1-reference"
      - name: Stage exact managed Moonshine token decoder
        shell: bash
        run: |
          python tools/fetch_moonshine_snapshot_metadata.py \
            --revision "390624ed33d594443aa4aa221f5b9f283b545b5a" \
            --destination "$RUNNER_TEMP/moonshine-tiny-small" \
            --output-manifest "$RUNNER_TEMP/moonshine-tiny.snapshot.json"
          python tools/prepare_unity_moonshine_token_decoder.py \
            --snapshot-dir "$RUNNER_TEMP/moonshine-tiny-small"
      - name: Build Android ARM64 IL2CPP APK with Marian + Moonshine
        shell: bash
        env:
          PHRASELAYER_ANDROID_BUILD_PATH: ${{ runner.temp }}/PhraseLayer.apk
        run: |
          chmod +x tools/unity/build-android-listen-mode.sh
          ./tools/unity/build-android-listen-mode.sh
      - name: Validate Android build evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "PhraseLayer.android-build-evidence.json"
          data = json.loads(evidence.read_text(encoding="utf-8"))
          assert data["schema_version"] == 1
          assert data["target"] == "Android"
          assert data["architecture"] == "ARM64"
          assert data["scripting_backend"] == "IL2CPP"
          assert data["translation_runtime"] == "Marian"
          assert data["asr_runtime"] == "MoonshineV1"
          assert data["dictionary_fallback_allowed"] is False
          assert data["result"] == "Succeeded"
          assert data["apk_size_bytes"] > 0
          print(json.dumps(data, sort_keys=True))
          PY
      - name: Require complete Android build evidence
        shell: bash
        run: |
          for file in \
            "$RUNNER_TEMP/PhraseLayer.apk" \
            "$RUNNER_TEMP/PhraseLayer.android-build-evidence.json" \
            "$RUNNER_TEMP/marian-unity/marian-export.json" \
            "$RUNNER_TEMP/marian-unity/marian-tokenizer-assets.json" \
            "$RUNNER_TEMP/marian-unity/marian-tokenizer-runtime.json"; do
            test -s "$file" || { echo "Missing required Android build evidence: $file" >&2; exit 1; }
          done
      - name: Upload Android build and evidence
        id: upload-build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phraselayer-android-listen-mode
          path: |
            ${{ runner.temp }}/PhraseLayer.apk
            ${{ runner.temp }}/PhraseLayer.android-build-evidence.json
            ${{ runner.temp }}/marian-unity/marian-export.json
            ${{ runner.temp }}/marian-unity/marian-tokenizer-assets.json
            ${{ runner.temp }}/marian-unity/marian-tokenizer-runtime.json
          if-no-files-found: warn
          retention-days: 7
      - name: Notify pull request of Android build artifact
        if: success()
        uses: ./.github/actions/notify-pr-artifact
        with:
          github-token: ${{ github.token }}
          artifact-url: ${{ steps.upload-build.outputs.artifact-url }}
          artifact-name: phraselayer-android-listen-mode
          message: Android ARM64 IL2CPP Listen Mode build is ready.
          contents: Includes the APK and build evidence proving Marian + Moonshine with dictionary fallback disabled.
