name: Translation candidate probe

on:
  workflow_dispatch:
  push:
    paths:
      - ci/translation-candidate-probe.request

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish pending candidate status
        uses: actions/github-script@v7
        with:
          script: |
            const statusContext = `phraselayer/translation-candidate-run-${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: statusContext,
              description: 'English-Japanese local model screening is running'
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install comparison toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.13.0" \
            "transformers==4.57.6" \
            "sentencepiece==0.2.2" \
            "sacrebleu==2.5.1"
          python -m pip freeze > translation-candidate-pip-freeze.txt

      - name: Compare pinned-resolution translation candidates
        id: compare
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          python tools/probe_translation_candidates.py \
            --report ".ci/translation-candidate-probe.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload candidate metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-candidate-probe
          path: |
            .ci/translation-candidate-probe.json
            translation-candidate-pip-freeze.txt
          if-no-files-found: error

      - name: Publish final candidate status
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_EXIT_CODE: ${{ steps.compare.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.ci/translation-candidate-probe.json';
            let report = null;
            if (fs.existsSync(reportPath)) {
              try {
                report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              } catch (error) {
                core.warning(`Could not parse translation candidate report: ${error}`);
              }
            }
            const exitCode = process.env.PROBE_EXIT_CODE || 'missing';
            const passed = exitCode === '0' && report && report.status === 'pass';
            const completed = report && Array.isArray(report.candidates)
              ? report.candidates.filter(item => item.status === 'pass').length
              : 0;
            const detail = passed
              ? `${completed} English-Japanese candidates measured on sentence+fragment smoke cases`
              : `Translation candidate probe failed (${report && report.error_type ? report.error_type : `exit=${exitCode}`})`;
            const statusContext = `phraselayer/translation-candidate-run-${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: statusContext,
              description: detail.slice(0, 140)
            });
            if (!passed) {
              core.setFailed(detail);
            }
