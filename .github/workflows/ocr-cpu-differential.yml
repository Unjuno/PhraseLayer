name: OCR CPU Differential
on:
  push:
    branches: ["agent/**", main]
    paths: ["models/models.lock.json", "tools/run_ppocr_cpu_reduction_experiment.py", "tools/audit_ppocr_dictionary_oracle.py", "tools/requirements-ocr-cpu-audit.txt", "tools/extract_ppocr_dictionary.py", "experiments/PhraseLayer.OcrOutputReplay/**", "src/PhraseLayer.Core/Paddle*.cs", ".github/workflows/ocr-cpu-differential.yml"]
  pull_request:
    paths: ["models/models.lock.json", "tools/run_ppocr_cpu_reduction_experiment.py", "tools/audit_ppocr_dictionary_oracle.py", "tools/requirements-ocr-cpu-audit.txt", "tools/extract_ppocr_dictionary.py", "experiments/PhraseLayer.OcrOutputReplay/**", "src/PhraseLayer.Core/Paddle*.cs", ".github/workflows/ocr-cpu-differential.yml"]
permissions:
  contents: read
concurrency:
  group: ocr-cpu-differential-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned host-only inference tools
        run: python -m pip install -r tools/requirements-ocr-cpu-audit.txt
      - name: Stage exact recognizer and metadata locally without redistribution
        run: python tools/stage_models.py --model pp-ocrv6-tiny-rec --include-support
      - name: Require independent YAML oracle and original dictionary lock agreement
        run: python tools/audit_ppocr_dictionary_oracle.py --metadata artifacts/models/pp-ocrv6-tiny-rec/inference.yml --report artifacts/ocr-cpu-audit/dictionary-oracle.json
      - name: Export the unchanged locked dictionary
        run: python tools/extract_ppocr_dictionary.py --metadata artifacts/models/pp-ocrv6-tiny-rec/inference.yml --output-dir artifacts/models/pp-ocrv6-tiny-rec
      - name: Execute pinned ONNX model and independent full-versus-packed oracle
        run: |
          python tools/run_ppocr_cpu_reduction_experiment.py \
            --model artifacts/models/pp-ocrv6-tiny-rec/inference.onnx \
            --dictionary artifacts/models/pp-ocrv6-tiny-rec/ppocr_keys.txt \
            --report artifacts/ocr-cpu-audit/report.json \
            --replay artifacts/ocr-cpu-audit/replay.json
      - name: Replay actual model outputs through production Core
        run: dotnet run --project experiments/PhraseLayer.OcrOutputReplay/PhraseLayer.OcrOutputReplay.csproj -c Release -- artifacts/ocr-cpu-audit/replay.json artifacts/ocr-cpu-audit/core-replay.json
      - name: Upload only numerical summaries, not models, images, dictionaries, or tensors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-cpu-differential-${{ github.run_id }}
          path: |
            artifacts/ocr-cpu-audit/dictionary-oracle.json
            artifacts/ocr-cpu-audit/report.json
            artifacts/ocr-cpu-audit/core-replay.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove locally staged model and replay payload
        if: always()
        run: rm -rf artifacts/models/pp-ocrv6-tiny-rec artifacts/ocr-cpu-audit/replay.json
