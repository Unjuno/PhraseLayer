name: Moonshine v1 ONNX Reference Probe

on:
  push:
    branches: ["agent/listen-mode-core"]
    paths:
      - ".github/workflows/moonshine-v1-onnx-reference-probe.yml"
      - ".github/actions/notify-pr-artifact/action.yml"
      - "tools/inspect_moonshine_v1_onnx_bundle.py"
      - "tools/test_inspect_moonshine_v1_onnx_bundle.py"
      - "tools/fetch_moonshine_beckett_fixture.py"
      - "tools/run_moonshine_v1_onnx_reference.py"
      - "tools/test_run_moonshine_v1_onnx_reference.py"
      - "tools/validate_moonshine_v1_reference_trace.py"
      - "tools/test_validate_moonshine_v1_reference_trace.py"
      - "models/evidence/moonshine-v1-tiny.*.json"
      - "src/PhraseLayer.Core/MoonshineOnnxGraphContract.cs"
      - "src/PhraseLayer.Core/MoonshineGreedyAsrRuntime.cs"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: moonshine-v1-onnx-reference-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  reference-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python tools/test_inspect_moonshine_v1_onnx_bundle.py
          python tools/test_fetch_moonshine_beckett_fixture.py
          python tools/test_run_moonshine_v1_onnx_reference.py
          python tools/test_validate_moonshine_v1_reference_trace.py
          python tools/validate_moonshine_v1_reference_trace.py
      - name: Install pinned probe dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "huggingface_hub==0.36.2" \
            "onnx==1.17.0" \
            "onnxruntime==1.29.0" \
            "numpy==2.5.2" \
            "tokenizers==0.22.1"
      - name: Stage published v1 reference graphs at an exact repository revision
        env:
          HF_HUB_DISABLE_XET: "0"
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="moonshine-ai/moonshine",
              revision="35b4aae79f7d598a4d36d5252ec26ad642faab60",
              allow_patterns=[
                  "onnx/tiny/preprocess.onnx",
                  "onnx/tiny/encode.onnx",
                  "onnx/tiny/uncached_decode.onnx",
                  "onnx/tiny/cached_decode.onnx",
              ],
              local_dir="${{ runner.temp }}/moonshine-v1-reference",
          )
          snapshot_download(
              repo_id="moonshine-ai/moonshine-tiny",
              revision="390624ed33d594443aa4aa221f5b9f283b545b5a",
              allow_patterns=["tokenizer.json"],
              local_dir="${{ runner.temp }}/moonshine-tokenizer",
          )
          PY
      - name: Inspect published graph ABI
        run: |
          python tools/inspect_moonshine_v1_onnx_bundle.py \
            --bundle-dir "$RUNNER_TEMP/moonshine-v1-reference/onnx/tiny" \
            --output "$RUNNER_TEMP/moonshine-v1-reference-abi.json"
      - name: Fetch pinned speech fixture
        run: |
          python tools/fetch_moonshine_beckett_fixture.py \
            --output "$RUNNER_TEMP/beckett.wav" \
            --manifest "$RUNNER_TEMP/beckett.fixture.json"
      - name: Run independent ONNX Runtime greedy reference
        run: |
          python tools/run_moonshine_v1_onnx_reference.py \
            --bundle-dir "$RUNNER_TEMP/moonshine-v1-reference/onnx/tiny" \
            --wav "$RUNNER_TEMP/beckett.wav" \
            --tokenizer "$RUNNER_TEMP/moonshine-tokenizer/tokenizer.json" \
            --output-json "$RUNNER_TEMP/beckett.reference-trace.json" \
            --output-tokens "$RUNNER_TEMP/beckett.reference-tokens.txt" \
            --output-transcript "$RUNNER_TEMP/beckett.reference-transcript.txt"
      - name: Compare fresh reference with committed evidence
        run: |
          python tools/validate_moonshine_v1_reference_trace.py \
            --actual-trace "$RUNNER_TEMP/beckett.reference-trace.json"
      - name: Upload reference fixture and parity evidence
        id: upload-parity
        uses: actions/upload-artifact@v4
        with:
          name: moonshine-v1-reference-parity
          path: |
            ${{ runner.temp }}/moonshine-v1-reference-abi.json
            ${{ runner.temp }}/beckett.wav
            ${{ runner.temp }}/beckett.fixture.json
            ${{ runner.temp }}/beckett.reference-trace.json
            ${{ runner.temp }}/beckett.reference-tokens.txt
            ${{ runner.temp }}/beckett.reference-transcript.txt
          if-no-files-found: error
          retention-days: 7
      - name: Notify pull request of fixture artifact
        uses: ./.github/actions/notify-pr-artifact
        with:
          github-token: ${{ github.token }}
          artifact-url: ${{ steps.upload-parity.outputs.artifact-url }}
          artifact-name: moonshine-v1-reference-parity
          message: Moonshine reference fixture is ready.
          contents: Includes the pinned `beckett.wav` fixture plus ONNX Runtime parity evidence.
