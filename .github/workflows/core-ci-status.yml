name: Core CI Status Link

on:
  workflow_run:
    workflows: ["Core CI"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish run link status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'failure';
            const state = conclusion === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state,
              context: `phraselayer/core-ci-run-${run.id}`,
              description: `Core CI ${conclusion}`.slice(0, 140),
              target_url: run.html_url
            });
