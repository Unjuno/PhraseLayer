name: Core CI Status Bridge

on:
  workflow_run:
    workflows: ["Core CI"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish MCP-readable run status
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'failure';
            const state = conclusion === 'success' ? 'success' : 'failure';

            // Encode the run id in the status context. Do not publish target_url here:
            // MCP can recover run.id from the context and query jobs/logs directly,
            // while URL publication has proven to be an unnecessary failure point.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state,
              context: `phraselayer/core-ci-run-${run.id}`,
              description: `Core CI ${conclusion}`.slice(0, 140)
            });
