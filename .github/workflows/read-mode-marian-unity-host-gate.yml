name: Read Mode Marian Unity Host Gate

on:
  workflow_dispatch:
    inputs:
      japanese_font_source:
        description: "Absolute path on the self-hosted Unity runner to a license-reviewed Japanese-capable .ttf or .otf"
        required: true
        type: string
      marian_source_snapshot:
        description: "Absolute path to the exact pinned Helsinki-NLP/opus-mt-en-jap source snapshot, including pytorch_model.bin"
        required: true
        type: string
      marian_onnx_dir:
        description: "Absolute path to the reviewed three-graph Optimum Marian ONNX export"
        required: true
        type: string

permissions:
  contents: read

jobs:
  read-mode-marian-unity-host-gate:
    runs-on: [self-hosted, unity, unity-6000-0-66f2]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate combined pre-device contracts
        shell: bash
        run: |
          python tools/validate_repo.py
          python tools/validate_local_ocr_asset_staging.py
          python tools/validate_ppocr_gpu_preprocess_gate.py
          python tools/validate_read_mode_mask_gate.py
          python tools/validate_mruk_environment_raycast_gate.py
          python tools/validate_passthrough_camera_frame_sync.py
          python tools/validate_read_mode_visual_asset_staging.py
          python tools/validate_marian_unity_product_gate.py
          python tools/validate_marian_android_fixture_gate.py
          python tools/validate_read_mode_marian_product_gate.py
          python tools/validate_unity_host_preflight.py
          python tools/test_inspect_android_apk_structure.py

      - name: Run real Unity host capability preflight
        shell: bash
        env:
          PHRASELAYER_UNITY_HOST_PREFLIGHT_EVIDENCE_PATH: ${{ runner.temp }}/PhraseLayer.unity-host-preflight.json
        run: |
          chmod +x tools/unity/run-host-preflight.sh
          ./tools/unity/run-host-preflight.sh

      - name: Require Unity host preflight evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "PhraseLayer.unity-host-preflight.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["purpose"] == "phrase-layer-real-unity-host-preflight"
          assert data["real_unity_execution"] is True
          assert data["exact_unity_version_match"] is True
          assert data["expected_unity_version"] == "6000.0.66f2"
          assert data["actual_unity_version"] == "6000.0.66f2"
          assert data["android_build_support_available"] is True
          assert data["inference_engine_compile_gate_active"] is True
          assert data["local_asset_paths_serialized"] is False
          assert data["adb_required"] is False
          assert data["quest_device_execution_performed"] is False
          PY

      - name: Download and stage exact pinned PP-OCR assets
        shell: bash
        run: |
          python tools/stage_models.py --purpose-prefix ocr- --include-support
          python tools/prepare_unity_ocr_assets.py

      - name: Require real Unity pinned PP-OCR inference and GPU preprocess parity
        shell: bash
        run: |
          chmod +x tools/unity/verify-local-ocr-inference.sh tools/unity/verify-ppocr-gpu-preprocess.sh
          ./tools/unity/verify-local-ocr-inference.sh
          ./tools/unity/verify-ppocr-gpu-preprocess.sh

      - name: Validate local Marian source snapshot and ONNX bundle identity
        shell: bash
        env:
          MARIAN_SOURCE_SNAPSHOT: ${{ inputs.marian_source_snapshot }}
          MARIAN_ONNX_DIR: ${{ inputs.marian_onnx_dir }}
        run: |
          python tools/prepare_marian_translation.py \
            --snapshot-dir "$MARIAN_SOURCE_SNAPSHOT" \
            --revision a863894cdd2b80f3bc1c5966734aee9ffec207d1 \
            --onnx-dir "$MARIAN_ONNX_DIR" \
            --output-manifest "$RUNNER_TEMP/marian-local-inputs.manifest.json"
          python tools/inspect_marian_onnx_bundle.py \
            --bundle-dir "$MARIAN_ONNX_DIR" \
            --output "$RUNNER_TEMP/marian-onnx-contract.manifest.json"

      - name: Build and stage managed Marian tokenizer runtime
        shell: bash
        run: |
          dotnet restore src/PhraseLayer.Tokenization.Microsoft/PhraseLayer.Tokenization.Microsoft.csproj
          dotnet build src/PhraseLayer.Tokenization.Microsoft/PhraseLayer.Tokenization.Microsoft.csproj -c Release --no-restore
          python tools/prepare_unity_tokenizer_runtime.py \
            --build-output src/PhraseLayer.Tokenization.Microsoft/bin/Release/netstandard2.1 \
            --destination unity/PhraseLayer.Unity/Assets/LocalTokenizerRuntime \
            --manifest "$RUNNER_TEMP/unity-tokenizer-runtime.manifest.json"

      - name: Generate offline Marian greedy reference and stage reviewed Marian assets
        shell: bash
        env:
          MARIAN_SOURCE_SNAPSHOT: ${{ inputs.marian_source_snapshot }}
          MARIAN_ONNX_DIR: ${{ inputs.marian_onnx_dir }}
        run: |
          python tools/generate_marian_reference_fixture.py \
            --source-dir "$MARIAN_SOURCE_SNAPSHOT" \
            --repository-root . \
            --output "$RUNNER_TEMP/marian-reference.json"
          python tools/prepare_unity_marian_assets.py \
            --source-dir "$MARIAN_SOURCE_SNAPSHOT" \
            --onnx-dir "$MARIAN_ONNX_DIR" \
            --reference-fixture "$RUNNER_TEMP/marian-reference.json" \
            --repository-root . \
            --unity-project unity/PhraseLayer.Unity

      - name: Require real Unity exact-token Marian translation parity
        shell: bash
        env:
          PHRASELAYER_MARIAN_PARITY_EVIDENCE_PATH: ${{ runner.temp }}/PhraseLayer.marian-unity-parity-evidence.json
        run: |
          chmod +x tools/unity/verify-local-marian-translation.sh
          ./tools/unity/verify-local-marian-translation.sh

      - name: Require Unity-authored Marian parity evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "PhraseLayer.marian-unity-parity-evidence.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["purpose"] == "phrase-layer-real-unity-marian-parity"
          assert data["model_revision"] == "a863894cdd2b80f3bc1c5966734aee9ffec207d1"
          assert data["real_unity_execution"] is True
          assert data["model_graph_contract_passed"] is True
          assert data["managed_tokenizer_source_token_parity_passed"] is True
          assert data["device_resident_backend_generated_token_parity_passed"] is True
          assert data["decoded_text_parity_passed"] is True
          assert data["language_pipeline_semantic_replacement_passed"] is True
          assert data["gloss_marker_injection_detected"] is False
          assert data["quest_device_execution_performed"] is False
          PY

      - name: Build one local-only Read Mode plus Marian Android ARM64 IL2CPP APK
        shell: bash
        env:
          PHRASELAYER_JAPANESE_FONT_SOURCE: ${{ inputs.japanese_font_source }}
          PHRASELAYER_READ_MODE_MARIAN_PRODUCT_APK_PATH: ${{ runner.temp }}/PhraseLayerReadModeMarianProductFixture.apk
        run: |
          chmod +x tools/unity/build-read-mode-marian-product-fixture.sh
          ./tools/unity/build-read-mode-marian-product-fixture.sh

      - name: Verify combined packaging evidence and inspect local APK
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          apk = temp / "PhraseLayerReadModeMarianProductFixture.apk"
          evidence_path = temp / "PhraseLayer.read-mode-marian-product-build-evidence.json"
          assert apk.is_file() and apk.stat().st_size > 0
          data = json.loads(evidence_path.read_text(encoding="utf-8"))
          assert data["purpose"] == "phrase-layer-read-mode-marian-product-android-fixture-build"
          assert data["result"] == "Succeeded"
          assert data["target"] == "Android" and data["architecture"] == "ARM64" and data["scripting_backend"] == "IL2CPP"
          assert data["ocr_runtime"] == "PaddleOCR" and data["surface_runtime"] == "MRUKEnvironmentRaycast"
          assert data["translation_runtime"] == "MarianOpusMtEnJa"
          assert data["generation_backend"] == "UnityMarianDeviceResidentGenerationBackend"
          assert data["tokenizer_runtime"] == "Microsoft.ML.Tokenizers"
          assert data["product_translation_gate"] is True and data["semantic_span_pipeline"] is True
          assert data["combined_single_scene_packaging"] is True
          assert data["source_weight_copied_to_unity"] is False and data["il2cpp_reflection_preserve_required"] is True
          assert data["quest_read_mode_smoke_autorun"] is False
          assert data["quest_device_execution_performed"] is False and data["android_runtime_execution_performed"] is False
          assert data["camera_pixel_pose_sync_verified"] is False
          assert data["ocr_redistribution_review"] == "pending" and data["translation_redistribution_review"] == "pending"
          assert data["apk_upload_allowed"] is False
          assert data["deterministic_single_scene_build"] is True
          assert data["scenes"] == ["Assets/Scenes/PhraseLayerDemo.unity"]
          assert data["apk_size_bytes"] == apk.stat().st_size
          digest = hashlib.sha256()
          with apk.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""): digest.update(chunk)
          fingerprint = {"schema_version":1,"purpose":"phrase-layer-local-read-mode-marian-product-apk-fingerprint","file_name":apk.name,"size_bytes":apk.stat().st_size,"sha256":digest.hexdigest(),"uploaded":False,"runtime_executed":False,"quest_executed":False,"redistribution_review":"pending"}
          (temp / "read-mode-marian-product-apk-fingerprint.json").write_text(json.dumps(fingerprint, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python tools/inspect_android_apk_structure.py --apk "$RUNNER_TEMP/PhraseLayerReadModeMarianProductFixture.apk" --output "$RUNNER_TEMP/read-mode-marian-product-apk-structure.json"

      - name: Write safe combined pre-device host evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          files = {
              "preflight": temp / "PhraseLayer.unity-host-preflight.json",
              "marian_parity": temp / "PhraseLayer.marian-unity-parity-evidence.json",
              "build": temp / "PhraseLayer.read-mode-marian-product-build-evidence.json",
              "visual": Path("unity/PhraseLayer.Unity/Assets/LocalReadModeAssets/read-mode-visual-assets.json"),
              "ocr_manifest": Path("unity/PhraseLayer.Unity/Assets/LocalOcrAssets/PaddleOCR/PhraseLayerOcrAssets.manifest.json"),
              "marian_manifest": Path("unity/PhraseLayer.Unity/Assets/LocalTranslationAssets/PhraseLayerMarianAssets.manifest.json"),
              "apk_fingerprint": temp / "read-mode-marian-product-apk-fingerprint.json",
              "apk_structure": temp / "read-mode-marian-product-apk-structure.json",
          }
          for path in files.values(): assert path.is_file() and path.stat().st_size > 0, path
          fp = json.loads(files["apk_fingerprint"].read_text(encoding="utf-8"))
          structure = json.loads(files["apk_structure"].read_text(encoding="utf-8"))
          assert structure["sha256"] == fp["sha256"] and structure["size_bytes"] == fp["size_bytes"]
          assert structure["zip_integrity_passed"] is True and structure["native_abis"] == ["arm64-v8a"]
          assert structure["arm64_only"] is True and structure["il2cpp_native_library_present"] is True
          assert structure["unity_player_library_present"] is True and structure["unity_data_entry_count"] > 0
          assert structure["runtime_execution_performed"] is False
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""): digest.update(chunk)
              return digest.hexdigest()
          apk = temp / "PhraseLayerReadModeMarianProductFixture.apk"
          apk.unlink()
          assert not apk.exists()
          manifest = {
              "schema_version": 1,
              "purpose": "phrase-layer-read-mode-marian-pre-device-unity-host-gate",
              "status": "pass",
              "git_sha": os.environ.get("GITHUB_SHA", "unobserved"),
              "real_unity_pinned_ocr_inference_passed": True,
              "real_unity_gpu_preprocess_parity_passed": True,
              "real_unity_marian_exact_token_parity_passed": True,
              "combined_android_arm64_il2cpp_fixture_built": True,
              "combined_single_scene_packaging_verified": True,
              "apk_structure_verified": True,
              "product_translation_gate": True,
              "quest_device_execution_performed": False,
              "android_runtime_execution_performed": False,
              "apk_uploaded": False,
              "apk_removed_before_artifact_upload": True,
              "redistribution_review": "pending",
              "local_apk_fingerprint": fp,
              "files": {name: {"name": path.name, "sha256": sha256(path)} for name, path in files.items()},
          }
          output = temp / "PhraseLayer.read-mode-marian-unity-host-gate.json"
          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Remove local combined APK before artifact phase
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/PhraseLayerReadModeMarianProductFixture.apk"

      - name: Upload safe combined host evidence only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phraselayer-read-mode-marian-unity-host-evidence
          path: |
            ${{ runner.temp }}/PhraseLayer.unity-host-preflight.json
            ${{ runner.temp }}/PhraseLayer.marian-unity-parity-evidence.json
            ${{ runner.temp }}/PhraseLayer.read-mode-marian-product-build-evidence.json
            ${{ runner.temp }}/PhraseLayer.read-mode-marian-unity-host-gate.json
            ${{ runner.temp }}/read-mode-marian-product-apk-fingerprint.json
            ${{ runner.temp }}/read-mode-marian-product-apk-structure.json
            unity/PhraseLayer.Unity/Assets/LocalReadModeAssets/read-mode-visual-assets.json
            unity/PhraseLayer.Unity/Assets/LocalOcrAssets/PaddleOCR/PhraseLayerOcrAssets.manifest.json
            unity/PhraseLayer.Unity/Assets/LocalTranslationAssets/PhraseLayerMarianAssets.manifest.json
          if-no-files-found: warn
          retention-days: 7
