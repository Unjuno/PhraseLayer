name: Moonshine Weight Probe

on:
  push:
    branches: ["agent/listen-mode-core"]
    paths:
      - ".github/workflows/moonshine-weight-probe.yml"
      - "tools/fetch_moonshine_weight_metadata.py"
      - "tools/test_fetch_moonshine_weight_metadata.py"
      - "models/models.lock.json"

concurrency:
  group: moonshine-weight-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_fetch_moonshine_weight_metadata.py
      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==0.36.2"
      - name: Probe exact source weight identity without downloading weights
        run: |
          python tools/fetch_moonshine_weight_metadata.py \
            --revision "390624ed33d594443aa4aa221f5b9f283b545b5a" \
            --output "$RUNNER_TEMP/moonshine-tiny.source-weight.json"
      - uses: actions/upload-artifact@v4
        with:
          name: moonshine-tiny-source-weight
          path: ${{ runner.temp }}/moonshine-tiny.source-weight.json
          if-no-files-found: error
          retention-days: 7
