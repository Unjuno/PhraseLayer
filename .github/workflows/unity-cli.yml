name: Unity CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/PhraseLayer.Tokenization.Microsoft/**"
      - "src/PhraseLayer.Core/MarianSentencePieceTokenizer.cs"
      - "unity/PhraseLayer.Unity/Assets/Scripts/UnityManagedMarianTokenizerLoader.cs"
      - "tools/prepare_unity_tokenizer_runtime.py"
      - "tools/unity/**"
      - ".github/workflows/unity-cli.yml"

concurrency:
  group: unity-cli-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, unity, unity-6000-0-66f2]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build managed SentencePiece adapter
        shell: bash
        run: |
          dotnet restore src/PhraseLayer.Tokenization.Microsoft/PhraseLayer.Tokenization.Microsoft.csproj
          dotnet build src/PhraseLayer.Tokenization.Microsoft/PhraseLayer.Tokenization.Microsoft.csproj -c Release --no-restore
      - name: Stage managed tokenizer runtime into Unity Assets
        shell: bash
        run: |
          python3 tools/prepare_unity_tokenizer_runtime.py \
            --build-output src/PhraseLayer.Tokenization.Microsoft/bin/Release/netstandard2.1 \
            --destination unity/PhraseLayer.Unity/Assets/LocalTokenizerRuntime \
            --manifest artifacts/tokenizer-runtime/unity-tokenizer-runtime.manifest.json
          test -f unity/PhraseLayer.Unity/Assets/LocalTokenizerRuntime/PhraseLayer.Tokenization.Microsoft.dll
          test -f unity/PhraseLayer.Unity/Assets/LocalTokenizerRuntime/Microsoft.ML.Tokenizers.dll
          test -f unity/PhraseLayer.Unity/Assets/LocalTokenizerRuntime/Google.Protobuf.dll
      - name: Verify Unity editor import and PhraseLayer shell
        shell: bash
        run: |
          chmod +x tools/unity/verify.sh
          ./tools/unity/verify.sh
