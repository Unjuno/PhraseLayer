name: OCR DB Acceptance Boundary

on:
  push:
    branches: ["agent/**"]
    paths:
      - "src/PhraseLayer.Core/PaddleDb*.cs"
      - "experiments/PhraseLayer.DetectorOutputReplay/**"
      - "tools/run_ppocr_db_acceptance_boundary.py"
      - "tools/requirements-ocr-db-audit.txt"
      - ".github/workflows/ocr-db-acceptance-boundary.yml"
  pull_request:
    paths:
      - "src/PhraseLayer.Core/PaddleDb*.cs"
      - "experiments/PhraseLayer.DetectorOutputReplay/**"
      - "tools/run_ppocr_db_acceptance_boundary.py"
      - "tools/requirements-ocr-db-audit.txt"
      - ".github/workflows/ocr-db-acceptance-boundary.yml"

permissions:
  contents: read

concurrency:
  group: ocr-db-acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned host-only geometry tools
        run: python -m pip install -r tools/requirements-ocr-db-audit.txt
      - name: Require identical DB accept/reject decisions around box threshold
        run: |
          python tools/run_ppocr_db_acceptance_boundary.py \
            --work-dir artifacts/ocr-db-acceptance/work \
            --report artifacts/ocr-db-acceptance/report.json
      - name: Upload numerical summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-db-acceptance-${{ github.run_id }}
          path: artifacts/ocr-db-acceptance/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove generated maps
        if: always()
        run: rm -rf artifacts/ocr-db-acceptance/work
