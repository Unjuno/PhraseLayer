name: Marian Snapshot Probe

on:
  push:
    branches: ["agent/marian-pinned-snapshot"]
    paths:
      - "tools/fetch_marian_snapshot_metadata.py"
      - "tools/validate_marian_snapshot_contract.py"
      - "models/models.lock.json"
      - ".github/workflows/marian-snapshot-probe.yml"
  workflow_dispatch:

concurrency:
  group: marian-snapshot-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.29.0"
      - name: Resolve current reviewed upstream revision
        run: |
          python tools/fetch_marian_snapshot_metadata.py \
            --revision main \
            --expected-prefix a863894 \
            --resolve-only
      - name: Stage and validate small revision-pinned snapshot
        run: |
          python tools/fetch_marian_snapshot_metadata.py \
            --revision main \
            --expected-prefix a863894 \
            --destination "$RUNNER_TEMP/opus-mt-en-jap-small" \
            --output-manifest "$RUNNER_TEMP/opus-mt-en-jap.snapshot.json"
      - uses: actions/upload-artifact@v4
        with:
          name: opus-mt-en-jap-snapshot-evidence
          path: ${{ runner.temp }}/opus-mt-en-jap.snapshot.json
          if-no-files-found: error
          retention-days: 7
