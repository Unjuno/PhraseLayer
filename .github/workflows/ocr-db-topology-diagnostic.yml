name: OCR DB Topology Diagnostic

on:
  push:
    branches: ["agent/**", main]
    paths:
      - "src/PhraseLayer.Core/PaddleDbPostprocess.cs"
      - "src/PhraseLayer.Core/PaddleDbQuadPostprocessor.cs"
      - "tools/run_ppocr_detector_db_differential.py"
      - "tools/run_ppocr_db_topology_stress.py"
      - "tools/run_ppocr_db_topology_diagnostic.py"
      - "tools/requirements-ocr-db-audit.txt"
      - "experiments/PhraseLayer.DetectorOutputReplay/**"
      - ".github/workflows/ocr-db-topology-diagnostic.yml"
  pull_request:
    paths:
      - "src/PhraseLayer.Core/PaddleDbPostprocess.cs"
      - "src/PhraseLayer.Core/PaddleDbQuadPostprocessor.cs"
      - "tools/run_ppocr_detector_db_differential.py"
      - "tools/run_ppocr_db_topology_stress.py"
      - "tools/run_ppocr_db_topology_diagnostic.py"
      - "tools/requirements-ocr-db-audit.txt"
      - "experiments/PhraseLayer.DetectorOutputReplay/**"
      - ".github/workflows/ocr-db-topology-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-db-topology-diagnostic-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned host-only DB oracle tools
        run: python -m pip install -r tools/requirements-ocr-db-audit.txt
      - name: Classify count mismatches by contour hierarchy
        run: |
          python tools/run_ppocr_db_topology_diagnostic.py \
            --work-dir artifacts/ocr-db-topology-diagnostic/work \
            --report artifacts/ocr-db-topology-diagnostic/report.json
      - name: Upload numerical summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-db-topology-diagnostic-${{ github.run_id }}
          path: artifacts/ocr-db-topology-diagnostic/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove local probability maps
        if: always()
        run: rm -rf artifacts/ocr-db-topology-diagnostic/work
