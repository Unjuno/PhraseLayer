name: Moonshine Unity Import

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: [self-hosted, unity, unity-6000-0-66f2]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Moonshine probe dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "huggingface_hub==0.36.2" \
            "onnxruntime==1.29.0" \
            "numpy==2.5.2" \
            "tokenizers==0.22.1"
      - name: Stage exact Moonshine v1 reference graphs outside git
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="UsefulSensors/moonshine",
              revision="35b4aae79f7d598a4d36d5252ec26ad642faab60",
              allow_patterns=[
                  "onnx/tiny/preprocess.onnx",
                  "onnx/tiny/encode.onnx",
                  "onnx/tiny/uncached_decode.onnx",
                  "onnx/tiny/cached_decode.onnx",
              ],
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "moonshine-v1-reference"),
          )
          PY
          python tools/prepare_unity_moonshine_v1_assets.py \
            --snapshot-root "$RUNNER_TEMP/moonshine-v1-reference"
      - name: Stage exact Moonshine tokenizer decoder resource without weights
        shell: bash
        run: |
          python tools/fetch_moonshine_snapshot_metadata.py \
            --revision "390624ed33d594443aa4aa221f5b9f283b545b5a" \
            --destination "$RUNNER_TEMP/moonshine-tiny-small" \
            --output-manifest "$RUNNER_TEMP/moonshine-tiny.snapshot.json"
          python tools/prepare_unity_moonshine_token_decoder.py \
            --snapshot-dir "$RUNNER_TEMP/moonshine-tiny-small"
      - name: Build pinned ONNX Runtime parity reference
        shell: bash
        run: |
          python tools/fetch_moonshine_beckett_fixture.py \
            --output "$RUNNER_TEMP/beckett.wav" \
            --manifest "$RUNNER_TEMP/beckett.fixture.json"
          python tools/run_moonshine_v1_onnx_reference.py \
            --bundle-dir "$RUNNER_TEMP/moonshine-v1-reference/onnx/tiny" \
            --wav "$RUNNER_TEMP/beckett.wav" \
            --tokenizer "$RUNNER_TEMP/moonshine-tiny-small/tokenizer.json" \
            --output-json "$RUNNER_TEMP/beckett.reference-trace.json" \
            --output-tokens "$RUNNER_TEMP/beckett.reference-tokens.txt" \
            --output-transcript "$RUNNER_TEMP/beckett.reference-transcript.txt"
          python tools/validate_moonshine_v1_reference_trace.py \
            --actual-trace "$RUNNER_TEMP/beckett.reference-trace.json"
      - name: Verify Unity 6000.0.66f2 import and Moonshine ABI
        shell: bash
        run: |
          chmod +x tools/unity/verify-moonshine-asr.sh
          ./tools/unity/verify-moonshine-asr.sh
      - name: Compare Unity token generation with ONNX Runtime reference
        shell: bash
        env:
          PHRASELAYER_MOONSHINE_FIXTURE_WAV: ${{ runner.temp }}/beckett.wav
          PHRASELAYER_MOONSHINE_EXPECTED_TOKENS: ${{ runner.temp }}/beckett.reference-tokens.txt
          PHRASELAYER_MOONSHINE_EXPECTED_TRANSCRIPT: ${{ runner.temp }}/beckett.reference-transcript.txt
          PHRASELAYER_MOONSHINE_ACTUAL_TOKENS: ${{ runner.temp }}/beckett.unity-tokens.txt
          PHRASELAYER_MOONSHINE_ACTUAL_TRANSCRIPT: ${{ runner.temp }}/beckett.unity-transcript.txt
        run: |
          chmod +x tools/unity/verify-moonshine-parity.sh
          ./tools/unity/verify-moonshine-parity.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moonshine-unity-parity-evidence
          path: |
            ${{ runner.temp }}/beckett.fixture.json
            ${{ runner.temp }}/beckett.reference-trace.json
            ${{ runner.temp }}/beckett.reference-tokens.txt
            ${{ runner.temp }}/beckett.reference-transcript.txt
            ${{ runner.temp }}/beckett.unity-tokens.txt
            ${{ runner.temp }}/beckett.unity-transcript.txt
          if-no-files-found: warn
          retention-days: 7
