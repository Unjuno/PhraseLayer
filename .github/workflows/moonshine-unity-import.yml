name: Moonshine Unity Import

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: [self-hosted, unity, unity-6000-0-66f2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==0.36.2"
      - name: Stage exact Moonshine v1 reference graphs outside git
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="moonshine-ai/moonshine",
              revision="35b4aae79f7d598a4d36d5252ec26ad642faab60",
              allow_patterns=[
                  "onnx/tiny/preprocess.onnx",
                  "onnx/tiny/encode.onnx",
                  "onnx/tiny/uncached_decode.onnx",
                  "onnx/tiny/cached_decode.onnx",
              ],
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "moonshine-v1-reference"),
          )
          PY
          python tools/prepare_unity_moonshine_v1_assets.py \
            --snapshot-root "$RUNNER_TEMP/moonshine-v1-reference"
      - name: Stage exact Moonshine tokenizer decoder resource without weights
        shell: bash
        run: |
          python tools/fetch_moonshine_snapshot_metadata.py \
            --revision "390624ed33d594443aa4aa221f5b9f283b545b5a" \
            --destination "$RUNNER_TEMP/moonshine-tiny-small" \
            --output-manifest "$RUNNER_TEMP/moonshine-tiny.snapshot.json"
          python tools/prepare_unity_moonshine_token_decoder.py \
            --snapshot-dir "$RUNNER_TEMP/moonshine-tiny-small"
      - name: Verify Unity 6000.0.66f2 import and Moonshine ABI
        shell: bash
        run: |
          chmod +x tools/unity/verify-moonshine-asr.sh
          ./tools/unity/verify-moonshine-asr.sh
