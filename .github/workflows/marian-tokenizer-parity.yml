name: Marian Tokenizer Parity

on:
  push:
    branches: ["agent/marian-tokenizer-parity"]
    paths:
      - "src/PhraseLayer.Core/MarianSentencePieceTokenizer.cs"
      - "src/PhraseLayer.Tokenization.Microsoft/**"
      - "tools/PhraseLayer.MarianTokenizerParity/**"
      - "tools/generate_marian_tokenizer_reference.py"
      - "tools/inspect_marian_sentencepiece_reference.py"
      - "tools/run_marian_tokenizer_parity_local.py"
      - "tools/requirements-marian-tokenizer-parity.txt"
      - "tests/fixtures/marian-tokenizer-parity-corpus.json"
      - "tools/fetch_marian_snapshot_metadata.py"
      - "models/models.lock.json"
      - "models/evidence/**"
      - ".github/workflows/marian-tokenizer-parity.yml"
  pull_request:
    paths:
      - "src/PhraseLayer.Core/MarianSentencePieceTokenizer.cs"
      - "src/PhraseLayer.Tokenization.Microsoft/**"
      - "tools/PhraseLayer.MarianTokenizerParity/**"
      - "tools/generate_marian_tokenizer_reference.py"
      - "tools/inspect_marian_sentencepiece_reference.py"
      - "tools/run_marian_tokenizer_parity_local.py"
      - "tools/requirements-marian-tokenizer-parity.txt"
      - "tests/fixtures/marian-tokenizer-parity-corpus.json"
      - "tools/fetch_marian_snapshot_metadata.py"
      - "models/models.lock.json"
      - "models/evidence/**"
      - ".github/workflows/marian-tokenizer-parity.yml"

concurrency:
  group: marian-tokenizer-parity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned tokenizer reference toolchain
        run: python -m pip install --disable-pip-version-check -r tools/requirements-marian-tokenizer-parity.txt
      - name: Run the same gate used on developer machines
        run: |
          python tools/run_marian_tokenizer_parity_local.py \
            --skip-bootstrap \
            --work-dir "$RUNNER_TEMP/marian-local-gate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marian-tokenizer-parity-evidence
          path: |
            ${{ runner.temp }}/marian-local-gate/live-snapshot.json
            ${{ runner.temp }}/marian-local-gate/marian-tokenizer-reference.json
            ${{ runner.temp }}/marian-local-gate/marian-sentencepiece-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
