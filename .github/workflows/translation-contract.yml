name: Translation Contract CI

on:
  push:
    branches: ["agent/**"]
    paths:
      - "models/models.lock.json"
      - "models/evidence/**"
      - "src/PhraseLayer.Core/**"
      - "src/PhraseLayer.Tokenization.Microsoft/**"
      - "tests/PhraseLayer.Core.Tests/**"
      - "tests/PhraseLayer.UnityMarianInferenceShell.Compile/**"
      - "unity/PhraseLayer.Unity/Assets/Scripts/UnityMarian**"
      - "unity/PhraseLayer.Unity/Assets/Editor/PhraseLayerLocalMarianAssets.cs"
      - "tools/prepare_marian_translation.py"
      - "tools/test_prepare_marian_translation.py"
      - "tools/prepare_unity_marian_assets.py"
      - "tools/generate_marian_reference_fixture.py"
      - "tools/test_generate_marian_reference_fixture.py"
      - "tools/validate_marian_unity_product_gate.py"
      - "tools/unity/verify-local-marian-translation.sh"
      - "tools/validate_marian_snapshot_contract.py"
      - "tools/test_validate_marian_snapshot_contract.py"
      - "tools/fetch_marian_snapshot_metadata.py"
      - "tools/test_fetch_marian_snapshot_metadata.py"
      - "tools/validate_marian_lock_evidence.py"
      - "tools/test_validate_marian_lock_evidence.py"
      - "tools/export_marian_onnx.py"
      - "tools/test_export_marian_onnx.py"
      - "tools/requirements-marian-export.txt"
      - "tools/inspect_marian_onnx_bundle.py"
      - "tools/test_inspect_marian_onnx_bundle.py"
      - ".github/workflows/marian-unity-host-gate.yml"
      - ".github/workflows/translation-contract.yml"
  pull_request:
    paths:
      - "models/models.lock.json"
      - "models/evidence/**"
      - "src/PhraseLayer.Core/**"
      - "src/PhraseLayer.Tokenization.Microsoft/**"
      - "tests/PhraseLayer.Core.Tests/**"
      - "tests/PhraseLayer.UnityMarianInferenceShell.Compile/**"
      - "unity/PhraseLayer.Unity/Assets/Scripts/UnityMarian**"
      - "unity/PhraseLayer.Unity/Assets/Editor/PhraseLayerLocalMarianAssets.cs"
      - "tools/prepare_marian_translation.py"
      - "tools/test_prepare_marian_translation.py"
      - "tools/prepare_unity_marian_assets.py"
      - "tools/generate_marian_reference_fixture.py"
      - "tools/test_generate_marian_reference_fixture.py"
      - "tools/validate_marian_unity_product_gate.py"
      - "tools/unity/verify-local-marian-translation.sh"
      - "tools/validate_marian_snapshot_contract.py"
      - "tools/test_validate_marian_snapshot_contract.py"
      - "tools/fetch_marian_snapshot_metadata.py"
      - "tools/test_fetch_marian_snapshot_metadata.py"
      - "tools/validate_marian_lock_evidence.py"
      - "tools/test_validate_marian_lock_evidence.py"
      - "tools/export_marian_onnx.py"
      - "tools/test_export_marian_onnx.py"
      - "tools/requirements-marian-export.txt"
      - "tools/inspect_marian_onnx_bundle.py"
      - "tools/test_inspect_marian_onnx_bundle.py"
      - ".github/workflows/marian-unity-host-gate.yml"
      - ".github/workflows/translation-contract.yml"

concurrency:
  group: translation-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python tools/test_prepare_marian_translation.py
      - run: python tools/test_generate_marian_reference_fixture.py
      - run: python tools/validate_marian_unity_product_gate.py
      - run: python tools/test_validate_marian_snapshot_contract.py
      - run: python tools/test_fetch_marian_snapshot_metadata.py
      - run: python tools/test_validate_marian_lock_evidence.py
      - run: python tools/validate_marian_lock_evidence.py
      - run: python tools/test_export_marian_onnx.py
      - run: python tools/test_inspect_marian_onnx_bundle.py
      - run: dotnet build tests/PhraseLayer.UnityMarianInferenceShell.Compile/PhraseLayer.UnityMarianInferenceShell.Compile.csproj -c Release
